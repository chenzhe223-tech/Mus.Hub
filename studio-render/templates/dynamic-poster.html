<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>音画 · 批量动态海报模板</title>
  <script src="/node_modules/gsap/dist/gsap.min.js"></script>
  <script src="/core/hyper-runtime.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      overflow: hidden;
      background: #0f1218;
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }
    .poster-root {
      position: relative;
      width: 900px;
      height: 1200px;
      overflow: hidden;
      padding: 64px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: #f5f0e8;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 16px;
      letter-spacing: 2.5px;
      opacity: 0.78;
      border-bottom: 1px solid rgba(255,255,255,0.15);
      padding-bottom: 14px;
    }
    .art-stage {
      position: relative;
      width: 100%;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 28px 0;
    }
    .cover-box {
      position: relative;
      width: 480px;
      height: 480px;
      border-radius: 26px;
      overflow: hidden;
      box-shadow: 0 32px 70px rgba(0,0,0,0.58);
      border: 2px solid rgba(255,255,255,0.22);
    }
    .cover-img { width: 100%; height: 100%; object-fit: cover; }
    .meta-title {
      font-family: "Noto Serif SC", "Songti SC", Georgia, serif;
      font-size: 52px;
      font-weight: 700;
      margin-bottom: 10px;
    }
    .meta-artist { font-size: 24px; opacity: 0.78; margin-bottom: 20px; }
    .meta-quote {
      font-size: 26px;
      line-height: 1.5;
      padding-left: 18px;
      border-left: 4px solid #e9be78;
      margin-bottom: 24px;
    }
    #posterWave { width: 100%; height: 54px; }
  </style>
</head>
<body>
  <div
    id="posterRoot"
    class="poster-root"
    data-composition-id="sonic-dynamic-poster"
    data-width="900"
    data-height="1200"
    data-duration="5"
    data-fps="30"
  >
    <div class="top-bar">
      <span>SONIC ARCHIVE / BATCH EDITION</span>
      <span id="tplTag">VINYL MOTION</span>
    </div>
    <div class="art-stage">
      <div class="cover-box" id="coverBox">
        <img id="coverImg" class="cover-img" alt="cover" />
      </div>
    </div>
    <div>
      <div id="mTitle" class="meta-title">夜航蓝调</div>
      <div id="mArtist" class="meta-artist">SONIC ARCHIVE</div>
      <div id="mQuote" class="meta-quote">“把喜欢的旋律留给今晚。”</div>
      <canvas id="posterWave" width="772" height="54"></canvas>
    </div>
  </div>

  <script>
    (function boot() {
      const vars = window.getHyperVars();
      const song = vars.song || { title: '夜航蓝调', artist: 'Blue Hour Quartet', lyric: '雨落在老唱片机旁。' };
      const pal = vars.palette || { bg1: '#0f1218', bg2: '#1b2638', accent: '#e9be78', text: '#f5f0e8' };
      const ratioMap = { '3:4': [900, 1200], '9:16': [1080, 1920], '1:1': [1080, 1080], '4:5': [960, 1200] };
      const ratio = (vars.config && vars.config.ratio) || '3:4';
      const [W, H] = ratioMap[ratio] || [900, 1200];
      const dur = Number(vars.durationSec || 5);

      const root = document.getElementById('posterRoot');
      root.style.width = `${W}px`;
      root.style.height = `${H}px`;
      root.style.background = `linear-gradient(155deg, ${pal.bg1}, ${pal.bg2})`;
      root.style.color = pal.text || '#f5f0e8';
      root.setAttribute('data-width', String(W));
      root.setAttribute('data-height', String(H));
      root.setAttribute('data-duration', String(dur));

      const fallbackSvg = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(
        `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="${pal.bg2}"/><stop offset="65%" stop-color="${pal.accent}"/><stop offset="100%" stop-color="${pal.bg1}"/></linearGradient></defs><rect width="800" height="800" fill="url(#g)"/><circle cx="400" cy="400" r="180" fill="#fff" fill-opacity="0.16"/></svg>`
      );
      document.getElementById('coverImg').src = song.cover || fallbackSvg;
      document.getElementById('mTitle').textContent = song.title;
      document.getElementById('mArtist').textContent = `${song.artist}${song.album ? ' · ' + song.album : ''}`;
      document.getElementById('mQuote').textContent = `“${(vars.config && vars.config.lyric) || song.lyric || ''}”`;
      document.getElementById('mQuote').style.borderColor = pal.accent;
      document.getElementById('tplTag').textContent = `${((vars.config && vars.config.template) || 'vinyl').toUpperCase()} · ${ratio}`;

      const tl = gsap.timeline({ paused: true });
      const wCtx = document.getElementById('posterWave').getContext('2d');

      function onFrame(tSec) {
        const box = document.getElementById('coverBox');
        box.style.transform = `translateY(${Math.sin(tSec * Math.PI * 2 / dur) * 8}px)`;
        const img = document.getElementById('coverImg');
        img.style.transform = `scale(${1.03 + Math.sin(tSec * 1.1) * 0.02})`;

        wCtx.clearRect(0, 0, 772, 54);
        const bars = 36;
        const gap = 6;
        const bw = (772 - (bars - 1) * gap) / bars;
        for (let i = 0; i < bars; i++) {
          const val = 0.25 + 0.75 * (Math.sin(i * 0.5 + tSec * 5.0) * 0.5 + 0.5);
          const bh = Math.max(8, val * 48);
          wCtx.fillStyle = i < bars * 0.52 ? pal.accent : 'rgba(255,255,255,0.25)';
          wCtx.beginPath();
          wCtx.roundRect(i * (bw + gap), (54 - bh) / 2, bw, bh, bw / 2);
          wCtx.fill();
        }
      }

      window.registerHyperComposition({ id: 'sonic-dynamic-poster', timeline: tl, onFrame });
    })();
  </script>
</body>
</html>
